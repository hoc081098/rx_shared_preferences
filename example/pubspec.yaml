name: example
description: Rx Shared Preferences example.
version: 3.0.0+1
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_provider: ^2.1.0
  rxdart_ext: ^0.3.0
  rx_shared_preferences:
  shared_preferences: ^2.5.4
  collection: ^1.19.1
dependency_overrides:
  rx_shared_preferences:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
