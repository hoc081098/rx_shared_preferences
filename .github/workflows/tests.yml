name: Flutter CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
  schedule:
    - cron: '0 2 */2 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            channel: stable
            version: ''
          - name: beta
            channel: beta
            version: ''
          - name: minimum (3.35.0)
            channel: stable
            version: '3.35.0'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        if: matrix.name == 'stable'
        working-directory: example
        run: flutter pub get

      - name: Format
        if: matrix.name == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze
        if: matrix.name == 'stable'
        run: flutter analyze --no-pub lib test example

      - name: Run tests
        if: matrix.name != 'stable'
        run: flutter test --no-pub

      - name: Run tests with coverage
        if: matrix.name == 'stable'
        run: flutter test --no-pub --coverage --coverage-path=coverage/lcov.info

      - name: Upload coverage
        if: matrix.name == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
